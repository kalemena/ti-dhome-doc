services:

  mqtt:
    # https://hub.docker.com/_/eclipse-mosquitto/
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./workspace/mosquitto/data:/mosquitto/data
      - ./workspace/mosquitto/log:/mosquitto/log
      - ./etc/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./workspace/mosquitto/config/password.txt:/mosquitto/config/password.txt
      - ./workspace/mosquitto/config/certs:/mosquitto/config/certs:ro
    networks:
      - ti-dhome

  caddy:
    # https://hub.docker.com/_/caddy
    # TLS termination in front of Node-RED (see etc/caddy/Caddyfile).
    # Port 1880 is no longer published: Caddy is the single entry point to
    # the internal ti-dhome network.
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # TLS certs / Caddy internal CA
      - caddy-config:/config
    env_file:
      - ./workspace/nodered.env
    networks:
      - ti-dhome
    depends_on:
      - nodered

  nodered:
    image: nodered/node-red:5.0.7
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    # No published port: reachable only through the Caddy gateway. Editor and
    # HTTP nodes are protected by adminAuth/httpNodeAuth from the mounted
    # settings.js; flow credentials are encrypted with the credential secret.
    env_file:
      - ./workspace/nodered.env
    volumes:
      - node-red-data:/data
      - ./etc/nodered/settings.js:/data/settings.js:ro
      - ./workspace/mosquitto/config/certs:/certs:ro
    networks:
      - ti-dhome
    depends_on:
      - mqtt

  victoriametrics:
    # https://github.com/VictoriaMetrics/VictoriaMetrics/releases
    image: victoriametrics/victoria-metrics:v1.151.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - -retentionPeriod=3y
      - -storageDataPath=/victoria-metrics-data
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    networks:
      - ti-dhome
    depends_on:
      - mqtt

  vmbackup:
    # One-shot incremental backup via the snapshot API (run: make backup.vm)
    # https://docs.victoriametrics.com/victoriametrics/vmbackup/
    image: victoriametrics/vmbackup:v1.151.0
    restart: "no"
    profiles:
      - backup
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
      - ./backup/vmbackup:/backup
      - vmbackup-tmp:/tmp   # scratch space for staging parts during a backup (see README)
    command:
      - -storageDataPath=/victoria-metrics-data
      - -snapshot.createURL=http://victoriametrics:8428/snapshot/create
      - -snapshot.deleteURL=http://victoriametrics:8428/snapshot/delete
      - -dst=fs:///backup
    networks:
      - ti-dhome
    depends_on:
      - victoriametrics

  grafana:
    # https://github.com/grafana/grafana/releases
    image: grafana/grafana-oss:12.4.2
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      # - ./etc/grafana:/etc/grafana
      # - ./var/lib/grafana:/var/lib/grafana
      # - ./var/log/grafana:/var/log/grafana
      - grafana-data:/var/lib/grafana
      #- ./etc/grafana/provisioning/:/etc/grafana/provisioning/
      #- ./etc/grafana/canvas/:/usr/share/grafana/public/img/bg/:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-default}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-password}
      GF_ENABLE_GZIP: true
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      #GF_INSTALL_PLUGINS: volkovlabs-echarts-panel,lehmannch-flow-panel
      #GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/Tidhome-Power.json
      GF_FEATURE_TOGGLES_ENABLE: topnav,newPanelChromeUI
    env_file:
      - .env
    networks:
      - ti-dhome

volumes:
  node-red-data:
  caddy-data:
  caddy-config:
  victoria-metrics-data:
  vmbackup-tmp:
  grafana-data:

networks:
  ti-dhome:
    name: ti-dhome