# Energy analysis configuration
# Discovery
# Selectors below correspond to the real metric names/labels.
#
# Naming reconciliation:
#   -> sensors_zigbee_energy_b{location="C03~Garage~PowerMeter"}
#   -> sensors_teleinfo_BBRHCJB{location="main"}
#   -> opendtu_YieldTotal{type="AC"}

vm:
  url: http://localhost:8428

window:
  # 1-year analysis window (365 days)
  start: 2025-09-01T00:00:00Z
  end: 2026-09-01T00:00:00Z

# Every cumulative counter is treated as a raw reading; scale_to_kwh converts
# its native unit into kWh (teleinfo counters are Wh).
metrics:
  solar_total:
    description: Solar panel total production (AC, inverter)
    selector: 'opendtu_YieldTotal{type="AC"}'
    unit: kWh
    scale_to_kwh: 1.0
  solar_dc0:
    description: Solar panel production MPPT channel 0 (DC)
    selector: 'opendtu_YieldTotal{type="DC",channel="0"}'
    unit: kWh
    scale_to_kwh: 1.0
  solar_dc1:
    description: Solar panel production MPPT channel 1 (DC)
    selector: 'opendtu_YieldTotal{type="DC",channel="1"}'
    unit: kWh
    scale_to_kwh: 1.0
  grid_in:
    description: Energy consumed from grid (garage power meter, phase b)
    selector: 'sensors_zigbee_energy_b{location="C03~Garage~PowerMeter"}'
    unit: kWh
    scale_to_kwh: 1.0
  grid_out:
    description: Energy produced to grid (garage power meter, phase b)
    selector: 'sensors_zigbee_energy_produced_b{location="C03~Garage~PowerMeter"}'
    unit: kWh
    scale_to_kwh: 1.0
  tempo_blue_hc:
    description: Tempo blue day, low-cost hours energy (Linky main meter)
    selector: 'sensors_teleinfo_BBRHCJB{location="main"}'
    unit: Wh
    scale_to_kwh: 0.001
  tempo_blue_hp:
    description: Tempo blue day, high-cost hours energy (Linky main meter)
    selector: 'sensors_teleinfo_BBRHPJB{location="main"}'
    unit: Wh
    scale_to_kwh: 0.001
  tempo_white_hc:
    description: Tempo white day, low-cost hours energy (Linky main meter)
    selector: 'sensors_teleinfo_BBRHCJW{location="main"}'
    unit: Wh
    scale_to_kwh: 0.001
  tempo_white_hp:
    description: Tempo white day, high-cost hours energy (Linky main meter)
    selector: 'sensors_teleinfo_BBRHPJW{location="main"}'
    unit: Wh
    scale_to_kwh: 0.001
  tempo_red_hc:
    description: Tempo red day, low-cost hours energy (Linky main meter)
    selector: 'sensors_teleinfo_BBRHCJR{location="main"}'
    unit: Wh
    scale_to_kwh: 0.001
  tempo_red_hp:
    description: Tempo red day, high-cost hours energy (Linky main meter)
    selector: 'sensors_teleinfo_BBRHPJR{location="main"}'
    unit: Wh
    scale_to_kwh: 0.001

# Energy tariffs (EUR/kWh, contract formulas from readme.adoc "Costs of Energy"):
#   base         single fixed rate all year            (kWhBase)
#   blue         HC/HP split, HP = 6h..22h            (kWhHC / kWhHP)
#   tempo        per Tempo color (blue/white/red) x HC/HP
#                (kWhTBHC, kWhTBHP, kWhTWHC, kWhTWHP, kWhTRHC, kWhTRHP)
#   zenfix       single fixed rate all year            (kWhZenFix)
#   zenfix-tempo HC/HP split, HP = 8h..12h + 17h..20h  (kWhZenFixHC / kWhZenFixHP)
#
# `hp_hours`: UTC hour windows considered High-price ("Heures Pleines") for that
# contract (informational; vmlib attributes per-hour energy to HP/HC from these
# windows for contracts that split by time of day).
# `rates` (tempo): per Tempo color x period, plain names (the metrics above
# carry the `tempo_` prefix).
tariffs:
  base:
    description: Fixed Cost (same price all hours)
    kind: flat
    rate_per_kwh: 0.2016
  blue:
    description: High/Low Cost (High = 6am to 10pm)
    kind: hp_hc
    hc_rate_per_kwh: 0.1696
    hp_rate_per_kwh: 0.2146
    hp_hours: [[6, 22]]
  tempo:
    description: High/Low Cost (High = 6am to 10pm) x High/Medium/Low days of year
    kind: tempo
    hp_hours: [[6, 22]]
    rates:
      blue_hc: 0.1288
      blue_hp: 0.1552
      white_hc: 0.1447
      white_hp: 0.1792
      red_hc: 0.1518
      red_hp: 0.6586
  zenfix:
    description: Fixed Cost - other contract
    kind: flat
    rate_per_kwh: 0.1753
  zenfix-tempo:
    description: High/Low Cost (High = 8h to 12h, and 17h to 20h)
    kind: hp_hc
    hc_rate_per_kwh: 0.1608
    hp_rate_per_kwh: 0.2028
    hp_hours: [[8, 12], [17, 20]]

# Identity check (validation, window 2025-09-01 -> 2026-09-01):
#   Grid In (zigbee)               = 3 345.9 kWh
#   Sum of Tempo counters (any)    = 3 406.2 kWh   ->  -1.8 % (OK)
# Blue HP/HC were never silent; White/Red are silent only when that Tempo
# color is inactive (spring/summer), in which case the Blue counters cover
# the consumption. White/Red "gaps" are therefore expected, not missing data.
# The dates below are the day-window samples where the White/Red counters had
# no samples at all (inactive periods) - informational only.
identity_tolerance: 0.05

# Solar data quality: the only anomaly found over the window is a flat AC
# counter day (2026-05-24) while the meter exported ~1.9 kWh; the same day
# shows an incomplete Tempo record. It is excluded from the PASS/FAIL
# decision.
#
# Thresholds for the hourly data-quality check ('--checks hourly'):
#   - solar_max_kwh_per_hour: physical cap for 1 kW of panels (1 kWh/h max);
#   - solar_max_tolerance_kwh: margin absorbed before flagging a counter jump
#     as impossible; effective cap = 1.0 + 0.15 = 1.15 kWh/h;
#   - solar_daylight_hours: UTC hours during which missing solar samples are
#     abnormal (night silence is expected and not flagged).
hourly_quality:
  solar_max_kwh_per_hour: 1.0
  solar_max_tolerance_kwh: 0.15
  solar_daylight_hours: [4, 20]
#
# Hourly data-quality findings (per-hour UTC slot labels, window start of the
# hour). These are acknowledged as known/reviewed so the hourly check PASSes;
# they remain listed in the report:
#   grid_missing_hour: single zigbee meter outage window 2025-10-12 05:00 -> 09:00
#   solar_missing_hour: opendtu silence during daylight; the symmetric night
#     hours are expected (no sun, no samples) and are not listed here.
#     2026-05-24 is covered by solar_flat_day above.
#   solar_over_max_hour: hourly AC increment beyond ~1 kWh/h (physical cap for
#     1 kW of panels); DC channels are all subsets of this AC list.
known_anomalies:
  solar_flat_day:
    - "2026-05-24"
  grid_missing_hour:
